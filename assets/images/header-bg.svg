<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29"/>
      <stop offset="50%" style="stop-color:#302b63"/>
      <stop offset="100%" style="stop-color:#24243e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- Grid lines -->
  <g opacity="0.08" stroke="#fff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>
  <!-- Dots -->
  <g fill="#00d2ff" opacity="0.12">
    <circle cx="150" cy="100" r="3"/><circle cx="300" cy="60" r="2"/>
    <circle cx="450" cy="130" r="4"/><circle cx="550" cy="80" r="2"/>
    <circle cx="700" cy="120" r="3"/><circle cx="850" cy="70" r="2"/>
    <circle cx="950" cy="150" r="3"/><circle cx="1050" cy="90" r="2"/>
    <circle cx="200" cy="300" r="2"/><circle cx="400" cy="280" r="3"/>
    <circle cx="600" cy="320" r="2"/><circle cx="800" cy="290" r="4"/>
    <circle cx="1000" cy="310" r="2"/><circle cx="100" cy="250" r="2"/>
    <circle cx="1100" cy="270" r="3"/>
  </g>
  <!-- Connection lines -->
  <g stroke="#7b2ff7" stroke-width="1" opacity="0.15">
    <line x1="150" y1="100" x2="300" y2="60"/>
    <line x1="300" y1="60" x2="450" y2="130"/>
    <line x1="450" y1="130" x2="700" y2="120"/>
    <line x1="700" y1="120" x2="950" y2="150"/>
    <line x1="200" y1="300" x2="400" y2="280"/>
    <line x1="400" y1="280" x2="800" y2="290"/>
  </g>
  <!-- Robot icon -->
  <g transform="translate(80, 160)" fill="none" stroke="#00d2ff" stroke-width="2" opacity="0.25">
    <rect x="0" y="10" width="40" height="35" rx="5"/>
    <circle cx="12" cy="25" r="5"/><circle cx="28" cy="25" r="5"/>
    <line x1="20" y1="0" x2="20" y2="10"/>
    <circle cx="20" cy="-3" r="3"/>
  </g>
  <!-- Car icon -->
  <g transform="translate(1060, 260)" fill="none" stroke="#7b2ff7" stroke-width="2" opacity="0.25">
    <path d="M0,20 L5,5 L35,5 L40,20 Z"/>
    <rect x="-5" y="20" width="50" height="15" rx="3"/>
    <circle cx="8" cy="38" r="5"/><circle cx="32" cy="38" r="5"/>
  </g>
  <!-- Accent line -->
  <rect x="350" y="385" width="500" height="2" rx="1" fill="#00d2ff" opacity="0.3"/>
</svg>
